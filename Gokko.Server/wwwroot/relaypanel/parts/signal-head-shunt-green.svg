<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 48" width="96" height="48">
  <!-- 信号表示灯（shunt・green）。JIS E 3012 の入換信号機（灯列式・2位式）の記号を、線路に沿って寝かせた形。扇形（4分の1の円）の中に、かどから弧へ線が1本。
       扇の中に埋め込みの小さな灯。足は (10,24)、灯の中心は (53.5,21.5)。右へ進む向き。左へ進む向きは、ほかの信号表示灯と同じく (63,24) で 180 度回す（左右は返さない） -->
  <defs><filter id="glow" x="-1" y="-1" width="3" height="3"><feGaussianBlur stdDeviation="3"/></filter><clipPath id="b"><circle cx="53.5" cy="21.5" r="6"/></clipPath></defs>
  <g stroke="#f5f6f7" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="10" y1="14" x2="10" y2="34"/><line x1="10" y1="24" x2="40" y2="24"/>
    <path d="M40,40 V8 H72 A32,32 0 0 1 40,40 Z M40,8 L62.63,30.63"/>
  </g>
  <circle cx="53.5" cy="21.5" r="10" fill="#a6eab2" opacity="1" filter="url(#glow)"/>
  <circle cx="53.5" cy="21.5" r="7.4" fill="#3c5360"/>
  <circle cx="53.5" cy="21.5" r="6" fill="#5fb17d"/>
  <g clip-path="url(#b)"><circle cx="54.46" cy="22.82" r="6" fill="#a6eab2"/></g>
  <circle cx="53.5" cy="21.5" r="6" fill="none" stroke="#377b57" stroke-width="1"/>
</svg>
