<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" preserveAspectRatio="none">
  <!-- 信号制御盤の盤面の地（1920×1080）。少し艶のある黒。左上からの光がにじんだ明るみと、うすい映り込みのすじ。盤の大きさが違う駅では引きのばして使う -->
  <defs>
    <linearGradient id="l" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#24262b"/><stop offset="0.45" stop-color="#17181c"/><stop offset="1" stop-color="#0c0d10"/>
    </linearGradient>
    <radialGradient id="s" cx="0.22" cy="0.08" r="0.75">
      <stop offset="0" stop-color="#aab4c4" stop-opacity="0.2"/><stop offset="0.5" stop-color="#aab4c4" stop-opacity="0.05"/><stop offset="1" stop-color="#aab4c4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.07"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#l)"/>
  <rect width="1920" height="1080" fill="url(#s)"/>
  <path d="M300,0 L900,0 L-180,1080 L-780,1080 Z" fill="url(#g)"/>
  <path d="M1080,0 L1210,0 L130,1080 L0,1080 Z" fill="url(#g)" opacity="0.7"/>
  <path d="M1620,0 L1960,0 L880,1080 L540,1080 Z" fill="url(#g)" opacity="0.5"/>
  <rect x="12" y="12" width="1896" height="1056" fill="none" stroke="#f5f6f7" stroke-width="2.4"/>
</svg>
