<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 48" width="96" height="48">
  <!-- 信号表示灯に重ねる記号（route4・off）。進路表示機。JIS E 3012 の記号で、柱の途中に付く四角の中に進路の数を書く。これは進路が 4 つのもの（数字の 4）。
       盤に彫ってあるだけの記号で、光らない。どういう進路を出せる信号機かを示す。off と white は同じ絵（どちらを置いても変わらない）。
       主信号機の信号表示灯（signal-head-4yg-* など）の上に、同じ位置・同じ大きさで重ねて置く（四角が柱の上に乗る）。足は (10,24)、四角の中心は (29,24)。
       右へ進む向き専用（左へ進む向きは route4l を使う） -->
  <rect x="21.5" y="13.5" width="15" height="21" fill="#36383e"/>
  <g stroke="#f5f6f7" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="21.5" y="13.5" width="15" height="21" stroke-width="2"/>
    <path d="M30.6,30.2 V18 L25.4,26.6 H33" stroke-width="1.7"/>
  </g>
</svg>
