  <circle cx="20" cy="20" r="13" fill="#f6eea4" opacity="1" filter="url(#glow)"/>
  <defs><clipPath id="b"><circle cx="20" cy="20" r="11"/></clipPath></defs>
  <circle cx="20" cy="20" r="11" fill="#cfb65d"/>
  <g clip-path="url(#b)"><circle cx="21.76" cy="22.42" r="11" fill="#f6eea4"/></g>
  <circle cx="20" cy="20" r="11" fill="none" stroke="#a1893d" stroke-width="1.1"/>
  <path d="M30.34,14.5 A12.2,12.2 0 0 1 14.5,30.78" fill="none" stroke="#e1e7e6" stroke-width="1" stroke-linecap="round" opacity="0.4"/>
