<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 20" width="32" height="20">
  <!-- 線路の帯の上の表示灯（yellow）。盤に埋め込んだ平らな窓。中心は (16,10)、窓は 22×10 の長丸。線路の向きに合わせて回す -->
  <defs>
    <filter id="glow" x="-0.6" y="-1.2" width="2.2" height="3.4"><feGaussianBlur stdDeviation="2.6"/></filter>
    <clipPath id="b"><rect x="5" y="5" width="22" height="10" rx="5"/></clipPath>
  </defs>
  <rect x="4" y="4" width="24" height="12" rx="6" fill="#f6eea4" opacity="1" filter="url(#glow)"/>
  <rect x="5" y="5" width="22" height="10" rx="5" fill="#cfb65d"/>
  <g clip-path="url(#b)"><rect x="6.2" y="6.8" width="22" height="10" rx="5" fill="#f6eea4"/></g>
  <rect x="5" y="5" width="22" height="10" rx="5" fill="none" stroke="#a1893d" stroke-width="1.1"/>
</svg>
