<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 88 88" width="88" height="88">
  <!-- 差した鍵の持ち手。盤の正面から見た形（平たい持ち手を、厚みの側から見ている）。中心は (44,44)。座の上に重ね、中心で回す。持ち手の長さは中心から上下 30（座の N・R の字にかからない長さ）。錠の丸い筒は座のほうに描いてあり、持ち手の下に見える -->
